<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
const CALL_MIN=60;
const PAL=["#6366f1","#0ea5e9","#14b8a6","#22c55e","#eab308","#f97316","#ef4444","#ec4899","#a855f7","#64748b"];
let crewDef={},jobTypes=[],newJCol=PAL[1],positions=[],newCol=PAL[0],pmRows=[],pmClient="",showHidden=false,pf=null,pmList=[];
const posColor=n=>positions.find(p=>p.name===n)?.color;
const dotBg=ps=>{const c=(ps||[]).map(posColor).filter(Boolean);return c.length>1?`linear-gradient(90deg,${c[0]} 50%,${c[1]} 50%)`:c.length?c[0]:"transparent"};
const dot=ps=>`<i class="dot" style="background:${dotBg(ps)}"></i>`;
const normCrew=a=>(a||[]).map(c=>typeof c==="string"?{name:c,pos:[]}:{name:c.name,pos:c.pos||[]});
let db=null,shoots=[],crew=[],clients=[],view="cal",cur=new Date(),form=null,warnMsg="";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayS=iso(new Date());
const toMin=t=>{const[a,b]=(t||"00:00").split(":").map(Number);return a*60+b};
const fromMin=m=>{m=Math.max(0,m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const autoCall=d=>fromMin(toMin(d.start)-CALL_MIN);
const callOf=d=>d.callManual&&d.call?d.call:autoCall(d);
const fmtT=t=>(t||"").replace(":",".");
const TIMES=[];for(let m=0;m<1440;m+=15)TIMES.push(fromMin(m));
const tsel=(i,k,v)=>`<select data-d="${i}" data-k="${k}">${(TIMES.includes(v)?TIMES:[...TIMES,v].sort()).map(t=>`<option value="${t}" ${t===v?"selected":""}>${fmtT(t)}</option>`).join("")}</select>`;
const fmtD=s=>new Date(s+"T00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short",year:"2-digit"});
const sorted=()=>[...shoots].sort((a,b)=>(+!!a.done-+!!b.done)||(a.days?.[0]?.date||"").localeCompare(b.days?.[0]?.date||""));

/* ---------- storage ---------- */
async function init(){
  try{db=await window.claude?.use("db")}catch(e){db=null}
  if(!db){warnMsg="ยังไม่ได้เชื่อมฐานข้อมูลแชร์ ข้อมูลจะอยู่แค่ในหน้านี้และหายเมื่อรีเฟรช";render();return}
  const err=e=>{warnMsg="เชื่อมฐานข้อมูลไม่สำเร็จ ("+(e?.code||"error")+") บัญชีนี้อาจไม่มีสิทธิ์แก้ไข";render()};
  db.collection("shoots").onSnapshot(s=>{shoots=s.docs.map(d=>({...d.data(),id:d.id}));render()},err);
  db.doc("settings/crew").onSnapshot(s=>{const d=s.exists?s.data():{};crew=d.names||[];crewDef=Object.fromEntries((d.items||[]).map(x=>[x.name,x.pos||[]]));render()},err);
  db.doc("settings/clients").onSnapshot(s=>{const d=s.exists?s.data():{};clients=d.names||[];clientLinks=Object.fromEntries((d.items||[]).map(x=>[x.name,x.link||""]));clientLogos=Object.fromEntries((d.items||[]).filter(x=>x.logo).map(x=>[x.name,x.logo]));render()},err);
  db.collection("pm").onSnapshot(s=>{pmRows=s.docs.map(d=>({...d.data(),id:d.id}));render()},err);
  db.doc("settings/jobtypes").onSnapshot(s=>{jobTypes=s.exists?(s.data().items||[]):[];render()},err);
  db.collection("pmgroups").onSnapshot(s=>{pmGroups=s.docs.map(d=>({...d.data(),id:d.id}));render()},err);
  db.collection("eqimg").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data().img||""});eqImgs=o;render()},err);
  db.doc("settings/socials").onSnapshot(s=>{const d=s.exists?s.data():{};clientSocial=Object.fromEntries((d.items||[]).map(x=>[x.client,{yt:x.yt||"",fb:x.fb||"",ig:x.ig||"",tt:x.tt||""}]));render()},err);
  db.collection("sbimg").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data().img||""});sbImgs=o;render()},err);
  db.collection("storyboards").onSnapshot(s=>{const srv=s.docs.map(d=>({...d.data(),id:d.id}));sbSrv={};srv.forEach(d=>{const{id,...r}=d;sbSrv[id]=r});sbDocs=[...srv.map(d=>sbDirty.has(d.id)?(sbDocs.find(x=>x.id===d.id)||d):d),...sbDocs.filter(x=>sbDirty.has(x.id)&&!srv.some(d=>d.id===x.id))];render()},err);
  db.collection("breakdowns").onSnapshot(s=>{const srv=s.docs.map(d=>({...d.data(),id:d.id}));bdSrv={};srv.forEach(d=>{const{id,...r}=d;bdSrv[id]=r});bdDocs=[...srv.map(d=>bdDirty.has(d.id)?(bdDocs.find(x=>x.id===d.id)||d):d),...bdDocs.filter(x=>bdDirty.has(x.id)&&!srv.some(d=>d.id===x.id))];render()},err);
  db.doc("settings/hashtags").onSnapshot(s=>{const d=s.exists?s.data():{};clientTags=Object.fromEntries((d.items||[]).map(x=>[x.client,x.tags||[]]));render()},err);
  db.doc("settings/equipment").onSnapshot(s=>{const d=s.exists?s.data():{};equip={items:d.items||[],types:d.types||[],statuses:d.statuses||[]};render()},err);
  db.doc("settings/positions").onSnapshot(s=>{positions=s.exists?(s.data().items||[]):[];render()},err);
}
async function saveShoot(o){
  const id=o.id||("s"+Date.now().toString(36)),body={...o};delete body.id;
  if(db){await db.doc("shoots/"+id).set(body)}else{shoots=shoots.filter(x=>x.id!==id).concat({...body,id});render()}
}
async function saveClients(names,links){if(db)await db.doc("settings/clients").set({names,items:names.map(n=>({name:n,link:links[n]||"",logo:clientLogos[n]||""}))});else{clients=names;clientLinks=links;render()}}
async function saveCrew(names,def){if(db)await db.doc("settings/crew").set({names,items:names.map(n=>({name:n,pos:def[n]||[]}))});else{crew=names;crewDef=def;render()}}
async function saveJt(arr){if(db)await db.doc("settings/jobtypes").set({items:arr});else{jobTypes=arr;render()}}
async function savePos(arr){if(db)await db.doc("settings/positions").set({items:arr});else{positions=arr;render()}}
async function savePm(o){
  const id=o.id||("p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),body={...o};delete body.id;
  if(db){await db.doc("pm/"+id).set(body)}else{pmRows=pmRows.filter(x=>x.id!==id).concat({...body,id});render()}
}
async function saveBd(o){const id=o.id,body={...o};delete body.id;body.mod=Date.now();bdSrv[id]={...body};
  if(db)await db.doc("breakdowns/"+id).set(body);else{bdDocs=bdDocs.filter(x=>x.id!==id).concat({...body,id});render()}}
async function delBd(id){bdDirty.delete(id);delete bdSrv[id];if(db)await db.doc("breakdowns/"+id).delete();else{bdDocs=bdDocs.filter(x=>x.id!==id);render()}}
async function saveSocial(){if(db)await db.doc("settings/socials").set({items:Object.entries(clientSocial).map(([client,v])=>({client,...v}))});render()}
const SVGW=b=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const SOC=[["yt","YouTube","#ff0000",SVGW('<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>')],
  ["fb","Facebook","#1877f2",SVGW('<path d="M14 8h2.2V5H14c-2.5 0-4 1.6-4 4v1.5H8v3h2V20h3v-6.5h2.3l.5-3H13V9.2c0-.8.4-1.2 1-1.2z" fill="currentColor" stroke="none"/>')],
  ["ig","Instagram","#e1306c",SVGW('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>')],
  ["tt","TikTok","var(--tx)",SVGW('<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.2 1.9 3.6 4 3.8"/>')]];
const socBtns=c=>SOC.map(([k,l,col,sv])=>{const u=linkOf(((clientSocial[c]||{})[k])||"");return u?`<a class="socb" href="${esc(u)}" target="_blank" rel="noopener" title="${l} ของ ${esc(c)}" style="color:${col}">${sv}</a>`:`<span class="socb off" title="ยังไม่ได้ตั้ง URL ${l} ที่ Setting > Client">${sv}</span>`}).join("");
async function saveTags(){if(db)await db.doc("settings/hashtags").set({items:Object.entries(clientTags).map(([client,tags])=>({client,tags}))});render()}
const tagsFor=f=>[...new Set([...(clientTags[f.client]||[]),...(f.ptags||[])])];
async function mergeLegacyTags(){const c=form.client;if(!c||!(form.ptags||[]).length)return;const cur=clientTags[c]||[],add=form.ptags.filter(t=>!cur.includes(t));form.ptags=[];if(add.length){clientTags={...clientTags,[c]:[...cur,...add]};await saveTags()}}
const newEid=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const imgOf=x=>(x&&(eqImgs[x.id]||x.img))||"";
async function saveEqImg(id,u){eqImgs={...eqImgs,[id]:u};if(db)await db.doc("eqimg/"+id).set({img:u});render()}
async function delEqImg(id){const o={...eqImgs};delete o[id];eqImgs=o;if(db)await db.doc("eqimg/"+id).delete();render()}
async function saveEquip(o){o={...o,items:(o.items||[]).map(x=>x.id?x:{...x,id:newEid()})};equip=o;if(db)await db.doc("settings/equipment").set(o);render()}
async function savePg(o){const id=o.id||("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),body={...o};delete body.id;if(db)await db.doc("pmgroups/"+id).set(body);else{pmGroups=pmGroups.filter(x=>x.id!==id).concat({...body,id});render()}return id}
async function delPg(id){if(db)await db.doc("pmgroups/"+id).delete();else{pmGroups=pmGroups.filter(x=>x.id!==id);render()}}
async function delPm(id){if(db)await db.doc("pm/"+id).delete();else{pmRows=pmRows.filter(x=>x.id!==id);render()}}
async function delShoot(id){if(db)await db.doc("shoots/"+id).delete();else{shoots=shoots.filter(x=>x.id!==id);render()}}


/* ---------- export / backup ---------- */
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--pop);color:var(--tx);border:1px solid var(--ac);border-radius:999px;padding:8px 18px;box-shadow:0 8px 24px #0006;font-size:14px";document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}

  <li><b>เพิ่มหัวข้อช่วง</b> – คลิกขวาที่ตารางเลือก “เพิ่มหัวข้อช่วง” (เช่น On Location) ใส่ข้อความ + เวลา</li>
  <li><b>ใส่เวลา</b> – เลือกเวลาเริ่ม–จบจาก Dropdown (เลือกนาทีได้ 1–59) หรือพิมพ์เองได้ · ปุ่ม <b>“–”</b> คือเครื่องคิดระยะเวลา: กรอกเวลาเริ่มก่อน แล้วเลือกหรือพิมพ์ระยะเวลา 1–120 นาที ระบบเติมเวลาจบให้</li>
  <li><b>สลับลำดับ</b> – กดค้างที่แถวแล้วลากเพื่อย้าย (เวลาจะอยู่ที่เดิม ไม่ย้ายตามแถว)</li>

  S("Template › Storyboard",`<ul>
  <li><b>Scripts</b> – ช่องพิมพ์สคริปต์ด้านบน</li>
  <li><b>+ Add</b> – เพิ่มช็อตหนึ่งช็อต: รูปภาพ, <b>Scene</b> (มุมซ้ายบนของรูป), <b>Duration</b> วินาที (มุมขวาบน), <b>Caption</b> ด้านล่างรูป และ <b>Camera Angle</b> (ขวาบนของ Caption)</li>

  <li>Save / Preview / Export PDF / แนวนอน-แนวตั้ง ใช้เหมือน Breakdown · Ctrl+S ใช้ได้</li></ul>`)+
  S("Crew – ดูงานรายคน",`<p>เลือกชื่อคนจาก Dropdown เพื่อดูทุกงานที่คนนั้นร่วม (ทั้งการ์ดถ่ายและงาน PM) สลับดูเป็นตารางหรือ Calendar ได้ · ปุ่ม <b>+ Add</b> สร้างการ์ดวันถ่ายใหม่โดยใส่คนที่เลือกเป็นทีมงานให้เลย</p>`)+
  S("ผู้ช่วย AI (✨)",`<ul><li>ถามเรื่องงานในแอปได้ เช่น “พรุ่งนี้มีงานถ่ายอะไรบ้าง” “คุณ A ว่างวันไหน”</li>
  <li>สั่งสร้างการ์ดได้ เช่น “สร้างการ์ดตัดต่อให้ Client X ส่ง Draft 1 วันที่ …” AI จะ<b>แสดงรายการให้ตรวจก่อน</b> และการ์ดจะถูกสร้างเมื่อกดยืนยันเท่านั้น</li>

  <li>กดปุ่มล้างแชตเพื่อเริ่มสนทนาใหม่</li></ul>`)+

function pull(){
  const g=id=>$("#"+id);if(!g("f-project"))return;
  form.project=g("f-project").value;if(g("f-ptagnew"))form.ptagnew=g("f-ptagnew").value;form.client=g("f-client").value;form.type=g("f-type").value;
  for(const[k,id]of[["ptitle","f-ptitle"],["pcap","f-pcap"],["sub","f-sub"],["location","f-loc"],["mapUrl","f-map"],["remark","f-remark"],["drive","f-drive"],["meetLink","f-meetlink"]])if(g(id))form[k]=g(id).value;
}
async function doSave(dv){
  pull();const dn=dv!==undefined?dv:!!form.done;const e=$("#ferr"),g=grpOf(form.type);
  if(!form.project.trim())return e.textContent="กรุณากรอกชื่อโปรเจกต์";
  if(!g)return e.textContent="กรุณาเลือกประเภทงาน";
  form.crew=form.crew.filter(c=>c.name);
  if(new Set(form.crew.map(c=>c.name)).size<form.crew.length)return e.textContent="มีชื่อคนซ้ำในทีม";
  await mergeLegacyTags();
  let kind,body;
  if(g==="shoot"){
    for(const d of form.days){
      if(!d.date)return e.textContent="กรุณาเลือกวันที่ให้ครบ";
      if(toMin(d.end)<=toMin(d.start))return e.textContent="เวลาจบต้องหลังเวลาเริ่ม (ถ่ายข้ามเที่ยงคืนให้แยกเป็น 2 วัน)";
    }
    form.days.sort((a,b)=>a.date.localeCompare(b.date));
    kind="shoot";body={done:dn,post:postObj(),equip:form.equip||[],bd:form.bd||"",sb:form.sb||"",client:form.client,project:form.project,type:"Shooting",crew:form.crew,days:form.days,location:form.location,mapUrl:form.mapUrl,drive:form.drive,remark:form.remark};
  }else{
    if(g==="meet"){
      if(!form.meetDate)return e.textContent="กรุณาเลือกวันประชุม";
      if(toMin(form.meetEnd)<=toMin(form.meetStart))return e.textContent="เวลาจบต้องหลังเวลาเริ่ม";
    }
    kind="pm";body={done:dn,post:postObj(),client:form.client,project:form.project,sub:(form.sub||"").trim(),type:form.type,people:form.crew,remark:form.remark,
      draft1:g==="work"?form.draft1:"",final:g==="work"?form.final:"",drive:g==="work"?form.drive:"",
      meetDate:g==="meet"?form.meetDate:"",meetStart:g==="meet"?form.meetStart:"",meetEnd:g==="meet"?form.meetEnd:"",meetLink:g==="meet"?form.meetLink:""};
  }
  try{
    const same=form.id&&form.kind===kind;
    if(form.id&&!same)await(form.kind==="shoot"?delShoot(form.id):delPm(form.id));
    await(kind==="shoot"?saveShoot:savePm)({...body,id:same?form.id:undefined});
    $("#dlg").close();
  }catch(x){e.textContent="บันทึกไม่สำเร็จ ("+(x?.code||"error")+")"}
}

  const b={r:"a",t:"",pending:true};aiMsgs.push(b);aiBusy=true;aiPlan=null;aiStatus="";aiCtl=new AbortController();aiPaint();
  try{
    const turns=aiTurns.slice(-14);while(turns.length&&turns[0].role!=="user")turns.shift();
    const res=await aiSample([{role:"user",content:aiInstr()},...turns],{tools:aiTools(),modelTier:"default",signal:aiCtl.signal,onText:u=>{b.t=u.text;aiPaint()}});
    b.t=res.text;aiTurns.push({role:"assistant",content:res.text});
  }catch(e){
    b.t=(e&&e.text)||"";if(b.t)aiTurns.push({role:"assistant",content:b.t});
    if(!e||e.code!=="cancelled")aiMsgs.push({r:"e",t:aiErrFull(e)});
  }finally{
    b.pending=false;aiBusy=false;aiStatus="";aiCtl=null;
    if(!b.t)aiMsgs.splice(aiMsgs.indexOf(b),1);
    if(aiPlan){aiMsgs.push({r:"plan",plan:aiPlan});aiPlan=null}
    aiPaint();
  }
}
function aiMount(){
  const f=document.createElement("button");f.id="aifab";f.title="ผู้ช่วย AI";f.setAttribute("aria-label","ผู้ช่วย AI");f.textContent="✨";document.body.appendChild(f);
  const p=document.createElement("div");p.id="aipanel";
  p.innerHTML=`<div class="aih"><b>✨ AI ผู้ช่วยจัดการงาน</b><button class="sm" id="aiclear" title="ล้างแชต">ล้าง</button><button class="sm" id="aiclose" aria-label="ปิด">✕</button></div><div class="aim" id="aimsgs"></div><div class="aiundo" id="aiundo"></div><div class="aif"><textarea id="aiin" rows="1" placeholder="ถามเรื่องงาน หรือสั่งสร้างการ์ด"></textarea><button class="pri" id="aisend">ส่ง</button></div>`;
  document.body.appendChild(p);
  f.onclick=()=>{p.classList.toggle("open");if(p.classList.contains("open")){aiPaint();document.getElementById("aiin").focus()}};
  p.addEventListener("click",async e=>{
    const t=e.target,c=n=>t.closest("["+n+"]");
    if(t.id==="aiclose"){p.classList.remove("open");return}
    if(t.id==="aiclear"){if(aiBusy&&aiCtl)aiCtl.abort();aiMsgs=[];aiTurns=[];aiPaint();return}
    if(t.id==="aisend"){if(aiBusy){aiCtl&&aiCtl.abort();return}const i=document.getElementById("aiin"),v=i.value;i.value="";aiSend(v);return}
    if(c("data-aiex")){aiSend(c("data-aiex").dataset.aiex);return}
    if(c("data-aiundo")){const n=await aiDoUndo();aiMsgs.push({r:"note",t:"ย้อนกลับแล้ว ("+n+" รายการ)"});aiTurns.push({role:"user",content:"[ระบบ] ผู้ใช้กดย้อนกลับการเปลี่ยนแปลงล่าสุดแล้ว"});aiPaint();return}
    if(c("data-aino")){const m=aiMsgs[+c("data-aino").dataset.aino];if(m&&m.plan&&m.plan.state==="pending"){m.plan.state="cancel";aiTurns.push({role:"user",content:"[ระบบ] ผู้ใช้ยกเลิกแผนที่เสนอ ไม่มีการแก้ไขข้อมูล"});aiPaint()}return}
    if(c("data-aiok")){const m=aiMsgs[+c("data-aiok").dataset.aiok];if(!m||!m.plan||m.plan.state!=="pending")return;
      m.plan.state="busy";aiPaint();
      try{const n=await aiApplyPlan(m.plan);m.plan.state="done";aiTurns.push({role:"user",content:"[ระบบ] ผู้ใช้ยืนยันและบันทึกข้อมูลเรียบร้อยแล้ว ("+n+" รายการ)"})}
      catch(err){m.plan.state="error";m.plan.err="บันทึกไม่สำเร็จ: "+((err&&(err.message||err.code))||"error");aiTurns.push({role:"user",content:"[ระบบ] การบันทึกไม่สำเร็จ"})}
      aiPaint();return}
  });
  p.addEventListener("change",e=>{const c=e.target.closest("[data-aichk]");if(!c)return;const[i,j]=c.dataset.aichk.split("|").map(Number),m=aiMsgs[i];if(m&&m.plan&&m.plan.items[j]){m.plan.items[j].on=c.checked;aiPaint()}});
  p.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="aiin"){e.preventDefault();if(!aiBusy){const i=e.target,v=i.value;i.value="";aiSend(v)}}});
  aiPaint();
}
async function aiBoot(){try{aiSample=window.claude?await window.claude.use("sample"):null}catch(e){aiSample=null}if(aiSample)aiMount()}



/* ---------- theme toggle ---------- */
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(m){document.documentElement.setAttribute("data-app",m);const b=document.getElementById("themebtn");if(b){b.innerHTML=m==="light"?MOON:SUN;b.title=m==="light"?"สลับเป็นโหมดมืด":"สลับเป็นโหมดสว่าง"}}
let appTheme="dark";try{appTheme=localStorage.getItem("ruap-theme")==="light"?"light":"dark"}catch(e){}
applyTheme(appTheme);
document.getElementById("themebtn").addEventListener("click",()=>{appTheme=appTheme==="light"?"dark":"light";try{localStorage.setItem("ruap-theme",appTheme)}catch(e){}applyTheme(appTheme)});
render();init();aiBoot();
</script>
